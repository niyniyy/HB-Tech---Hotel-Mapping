version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: hotel_mapping_db_v2
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_mapping
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: hotel_mapping_redis_v2
    restart: always
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_mapping_api_v2
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/hotel_mapping
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/hotel_mapping
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_mapping_worker_v2
    command: celery -A app.jobs.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/hotel_mapping
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/hotel_mapping
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data_v2: